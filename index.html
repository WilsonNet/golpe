<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- `user-scalable=no` and `viewport-fit=cover` are what make this playable
         on a phone: pinch-zoom on a d-pad is a lost exchange, a double tap meant
         to be two slashes must not zoom the page, and the deck has to reach the
         bottom edge under a notch. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14121c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="/style.css">
    <title>Vento Áureo</title>
</head>

    <script type="module" src="/src/main.tsx"></script>

</body>
</html>
