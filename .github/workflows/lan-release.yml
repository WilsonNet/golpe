name: LAN release

# One pack per OS, built on that OS: `node-datachannel` is a native addon and
# cannot be cross-compiled. A tag is the only trigger, so an artifact always
# names a commit and a version. Unsigned for now; macOS Gatekeeper and Windows
# SmartScreen will warn until the signing secrets are added.

on:
  push:
    tags:
      - "lan-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for the packaged probe
        run: pnpm exec playwright install --with-deps chromium

      - name: Stage the pack from a clean checkout
        run: pnpm run lan:package --release

      - name: The packaged binary plays the game
        run: pnpm run lan:probe

      - name: The host's own room is badged LAN and pinned first
        run: pnpm run lan:ui

      - name: Upload the pack and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: golpe-lan-${{ matrix.os }}
          path: |
            build/golpe-lan-*
          if-no-files-found: error

  checksums:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          cd artifacts
          sha256sum golpe-lan-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: golpe-lan-checksums
          path: artifacts/SHA256SUMS.txt
